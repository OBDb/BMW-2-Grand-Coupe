generations:
  - name: "First Generation (F44)"
    start_year: 2019
    end_year: 2024
    description: "The BMW 2 Series Gran Coupe is BMW's first compact four-door coupe, designed to compete with vehicles like the Mercedes-Benz CLA. Built on BMW's UKL2 front-wheel drive platform (shared with the F40 1 Series), it features a sleek, coupe-like roofline combined with four doors and a traditional trunk. Revealed in October 2019, the Gran Coupe is the smallest four-door sedan offered by BMW in most markets. Engine options range from a 1.5L three-cylinder in the 218i to a 2.0L turbocharged four-cylinder in the range-topping M235i xDrive, which produces 306 HP and features all-wheel drive. The interior adopts BMW's latest design language with digital instrumentation, a central touchscreen featuring BMW Operating System 7.0, and ambient lighting. Despite the front-wheel drive architecture, BMW focused on delivering engaging driving dynamics through sophisticated chassis tuning and technology including ARB (actuator contiguous wheel slip limitation) for improved traction control. The 2 Series Gran Coupe represents BMW's response to growing demand for style-focused compact premium sedans."
  - name: "Second Generation (F74)"
    start_year: 2025
    end_year: null
    description: "The second-generation BMW 2 Series Gran Coupé was officially unveiled on 15 October 2024. It retains the front-wheel drive UKL2 architecture and shares components with the F70 1 Series. The interior is completely redesigned and features a curved display powered by the latest BMW Operating System 9. The 2 Series comes standard with the 1.5L three-cylinder mild hybrid engine based on the B38 platform. Production at the BMW Leipzig Plant commenced in November 2024 with a scheduled market launch in March 2025."
